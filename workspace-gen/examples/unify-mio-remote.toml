# Workspace: feature unification bug for `krate/feat` syntax on optional dep
#
# Reproduces a case where one workspace member (`dep_with`) enables a
# bunch of features on a third-party crate (`mio`) directly, while
# another member (`dep_without`) pulls in `mio` transitively through
# a crate (`tokio_like`) that has `mio` declared as an *optional* dep
# and uses the `mio/<feat>` syntax (Remote, not `dep:mio`) in its
# features.
#
# In the real-world case that motivated this test:
#   - `tokio_like` declares `mio` as an *optional* dependency in
#     both the unconditional `[dependencies]` table and a
#     target-specific `[target.'cfg(...)'.dependencies]` table
#     (mirroring how `tokio` declares `mio`)
#   - `tokio_like`'s `io_uring` feature enables `mio/os_poll` and
#     `mio/os_ext` via the `krate/feat` syntax
#   - `dep_without` depends on `tokio_like` with `io_uring` enabled,
#     so mio is pulled in with `os_poll` and `os_ext`
#   - `dep_with` depends on `mio` directly with
#     `default, log, net, os_ext, os_poll`
#   - the workspace as a whole unifies `mio` with the full set
#
# Hackerman should detect that `dep_without` is missing the
# `default`, `log`, `net` mio features, but currently it does not
# because the `krate/feat` syntax on an optional dep is not turned
# into a `Trigger` (which is what wires up the soft dep correctly).
#
# The custom cfg `my_custom_flag` stands in for a real-world custom
# cfg like `tokio_unstable` that is not enabled by default in rustc
# and therefore does not appear in `rustc --print=cfg`. When the
# second mio dep's target cfg is not satisfied, the Remote edge from
# `io_uring` to `mio/os_poll` is filtered out, so mio never ends up
# in `dep_without`'s dep tree, and the check never gets a chance to
# compare mio's feature sets.

[workspace]
name = "unify-mio-remote"

[[crates]]
name = "log"
version = "0.1.0"

[[crates]]
name = "mio"
version = "0.1.0"
dependencies = { log = { version = "0.1.0", optional = true } }
features = { log = ["dep:log"], os_poll = [], os_ext = ["os_poll"], net = [], default = ["log"] }

[[crates]]
name = "tokio_like"
version = "0.1.0"
dependencies = { mio = { version = "0.1.0", optional = true, default_features = false } }
features = { io_uring = ["mio/os_poll", "mio/os_ext"] }

[[crates.platform]]
target = 'cfg(my_custom_flag)'
dependencies = { mio = { version = "0.1.0", optional = true, default_features = false, features = ["os_poll", "os_ext"] } }

[[crates]]
name = "dep_with"
version = "0.1.0"
workspace_member = true
dependencies = { mio = { version = "0.1.0", features = ["default", "log", "net", "os_ext", "os_poll"] } }

[[crates]]
name = "dep_without"
version = "0.1.0"
workspace_member = true
dependencies = { tokio_like = { version = "0.1.0", features = ["io_uring"] } }
